# ============================================================================
# SPARK CONFIGURATION FILE - spark-defaults.conf
# ============================================================================
#
# This file contains default Spark configurations for the Spark Lab environment.
# It applies to both single-node and cluster modes unless overridden at runtime.
#
# DOCUMENTATION FORMAT:
#   Each configuration is documented with:
#     WHAT:   What the configuration does
#     WHY:    Why this specific value was chosen for this lab environment
#     HOW:    How Spark uses this setting internally
#     IMPACT: Performance and resource implications
#     PROD:   How this would typically differ in production
#
# CONFIGURATION PRECEDENCE (lowest to highest):
#   1. spark-defaults.conf (this file)
#   2. spark-env.sh environment variables
#   3. SparkConf in code
#   4. Command-line --conf flags
#
# NOTE: spark.master is intentionally NOT set here to allow runtime flexibility:
#   - Single-node mode uses: local[*] (all available cores in driver JVM)
#   - Cluster mode uses: spark://spark-master:7077
#
# ============================================================================


# ============================================================================
# APPLICATION IDENTITY
# ============================================================================
# WHAT:   Sets the default application name shown in Spark UIs and logs
# WHY:    "Spark-Lab" clearly identifies jobs from this environment
# HOW:    Appears in Master UI, History Server, and log files
# IMPACT: No performance impact - purely for identification
# PROD:   Should be unique per application (e.g., "ETL-Users-Daily")
# ============================================================================
spark.app.name                          Spark-Lab


# ============================================================================
# DRIVER MEMORY CONFIGURATION
# ============================================================================
# The driver is the "brain" of your Spark application - it:
#   - Runs your main() function
#   - Creates the SparkContext/SparkSession
#   - Schedules tasks and tracks their status
#   - Collects results when you call .collect()
#   - Holds broadcast variables before distribution
# ============================================================================

# WHAT:   Heap memory allocated to the driver JVM process
# WHY:    2GB is sufficient for lab work - handles most collect() operations
#         and broadcast variables without overwhelming your dev machine
# HOW:    JVM heap where driver code runs, stores broadcast data, collects results
# IMPACT: Too low = OOM errors on .collect() or large broadcasts
#         Too high = Wastes memory that could go to executors
# PROD:   Typically 4-16GB depending on broadcast sizes and collect() usage
#         Rule of thumb: broadcast_data_size * 2 + 2GB baseline
spark.driver.memory                     2g

# WHAT:   Off-heap memory for JVM overhead (metaspace, threads, native libs)
# WHY:    512MB provides buffer for JVM internals beyond heap
# HOW:    Added to driver.memory for total container memory request
#         Formula: max(384MB, driver.memory * 0.10)
# IMPACT: Too low = Container killed by OS/YARN for exceeding memory
#         Too high = Wastes cluster resources
# PROD:   Usually 10-20% of driver.memory, minimum 384MB
spark.driver.memoryOverhead             512m


# ============================================================================
# EXECUTOR MEMORY CONFIGURATION
# ============================================================================
# Executors are worker JVM processes that:
#   - Run the actual data processing tasks
#   - Store cached data (RDDs, DataFrames)
#   - Shuffle data between stages
#   - Report status back to the driver
#
# Memory is divided into regions:
#   [========== Executor Memory (2g) ==========]
#   [  Execution (shuffle, joins, sorts)  |  Storage (cache)  |  Reserved  ]
#   [<---- spark.memory.fraction (0.6) --->|<-- remaining -->|<-- 300MB -->]
# ============================================================================

# WHAT:   Heap memory allocated to each executor JVM
# WHY:    2GB per executor is reasonable for lab datasets (up to ~1M records)
#         Allows running multiple executors on a typical dev machine
# HOW:    Each executor gets this much heap for processing + caching
# IMPACT: Too low = OOM, excessive spill to disk, slow joins
#         Too high = Longer GC pauses, fewer executors per node
# PROD:   Typically 4-16GB. Sweet spot often 4-8GB for balanced GC
#         Avoid >32GB (can't use compressed object pointers)
spark.executor.memory                   2g

# WHAT:   Off-heap memory overhead per executor
# WHY:    512MB covers JVM internals, Python/PySpark interop overhead
# HOW:    Added to executor.memory for total container memory
#         Default formula: max(384MB, executor.memory * 0.10)
# IMPACT: Too low = Container killed, "Container killed by YARN" errors
#         Too high = Reduces memory available for actual processing
# PROD:   10-20% of executor.memory. Increase for PySpark workloads
#         PySpark creates separate Python processes that need extra memory
spark.executor.memoryOverhead           512m


# ============================================================================
# CPU / PARALLELISM CONFIGURATION
# ============================================================================
# Parallelism determines how work is divided:
#   - More partitions = more parallel tasks = better utilization
#   - Too many partitions = overhead from task scheduling
#   - Too few partitions = underutilization, large task memory footprint
# ============================================================================

# WHAT:   Number of CPU cores each executor can use
# WHY:    2 cores per executor is a good balance for lab environment
#         Allows multiple concurrent tasks without overwhelming the machine
# HOW:    Executor runs this many tasks simultaneously
# IMPACT: More cores = more parallelism but more memory contention
#         Fewer cores = less parallelism but simpler memory management
# PROD:   Typically 4-5 cores per executor (leaves room for OS/HDFS)
#         Rule: nodes have N cores, use executors with 4-5 cores each
spark.executor.cores                    2

# WHAT:   Default number of partitions for RDD transformations (e.g., reduceByKey)
# WHY:    4 partitions works well with 2-core executors in lab environment
#         Rule of thumb: 2-3x total cores across all executors
# HOW:    Used when Spark needs to create partitions and no explicit value given
# IMPACT: Too low = Underutilization, large partition sizes
#         Too high = Excessive scheduling overhead, small files
# PROD:   Typically 200-2000 depending on data size and cluster size
#         Start with 2-3x total executor cores, tune based on task duration
spark.default.parallelism               4


# ============================================================================
# SHUFFLE CONFIGURATION
# ============================================================================
# Shuffles occur when data must be redistributed across the cluster:
#   - GROUP BY operations
#   - JOIN operations (for most join types)
#   - DISTINCT, repartition(), etc.
#
# Shuffles are expensive - they write data to disk and transfer over network
# ============================================================================

# WHAT:   Number of partitions for shuffle operations (joins, aggregations)
# WHY:    8 partitions is reasonable for lab datasets
#         More than default.parallelism because shuffles handle more data
# HOW:    After a shuffle, data is split into this many partitions
#         Each partition becomes one task in the next stage
# IMPACT: Too low = Large partitions, memory pressure, slow tasks
#         Too high = Many small files, excessive task overhead
# PROD:   Start with 200 (Spark's default), tune based on:
#         - Aim for 100-200MB per partition after shuffle
#         - Adjust using spark.sql.adaptive if enabled
spark.sql.shuffle.partitions            8


# ============================================================================
# ADAPTIVE QUERY EXECUTION (AQE) - Spark 3.0+
# ============================================================================
# AQE dynamically optimizes query execution based on runtime statistics.
# It can:
#   - Coalesce small shuffle partitions
#   - Convert sort-merge joins to broadcast joins
#   - Optimize skewed joins
#
# This is one of Spark 3's most impactful performance features!
# ============================================================================

# WHAT:   Master switch to enable Adaptive Query Execution
# WHY:    AQE automatically tunes execution - essential for learning and prod
#         Reduces need to manually tune shuffle partitions
# HOW:    After each stage, Spark collects statistics and may reoptimize
# IMPACT: Can significantly improve performance with no manual tuning
#         Small overhead from statistics collection (usually negligible)
# PROD:   ALWAYS enable in Spark 3.x - there's no good reason to disable
spark.sql.adaptive.enabled              true

# WHAT:   Enables automatic coalescing of small shuffle partitions
# WHY:    Prevents "small files problem" - combines tiny partitions
# HOW:    After shuffle, if partitions are smaller than advisory size,
#         Spark combines them into larger partitions
# IMPACT: Reduces number of tasks, improves efficiency
#         Especially helpful when shuffle.partitions is set too high
# PROD:   Always enable alongside AQE
spark.sql.adaptive.coalescePartitions.enabled           true

# WHAT:   Initial number of shuffle partitions before AQE coalescing
# WHY:    8 is reasonable for lab - AQE will coalesce if too many
#         In production, set higher and let AQE reduce
# HOW:    Spark starts with this many partitions, then coalesces
# IMPACT: Higher = more initial partitions to potentially coalesce
#         Lower = might not have enough parallelism initially
# PROD:   Set to spark.sql.shuffle.partitions or higher
#         Let AQE do the coalescing work
spark.sql.adaptive.coalescePartitions.initialPartitionNum   8

# WHAT:   Target size for each partition after AQE coalescing
# WHY:    64MB is good balance - not too small (overhead) or large (memory)
# HOW:    AQE combines partitions until they reach approximately this size
# IMPACT: Smaller = more partitions, more parallelism, more overhead
#         Larger = fewer partitions, less parallelism, less overhead
# PROD:   64-128MB is typical. Adjust based on executor memory
#         Larger partitions if executors have more memory
spark.sql.adaptive.advisoryPartitionSizeInBytes         64MB


# ============================================================================
# SERIALIZATION CONFIGURATION
# ============================================================================
# Serialization converts objects to bytes for:
#   - Shuffling data between executors
#   - Caching data to disk
#   - Sending tasks and results between driver/executors
#
# Kryo is significantly faster and more compact than Java serialization
# ============================================================================

# WHAT:   Specifies the serializer class for shuffling and caching
# WHY:    Kryo is 10x faster and more compact than Java serialization
#         Essential for good performance
# HOW:    All shuffle and cache operations use this serializer
# IMPACT: Major performance improvement - use Kryo always
#         Some custom classes may need registration for best performance
# PROD:   Always use Kryo. Register custom classes with:
#         spark.kryo.classesToRegister=com.example.MyClass
spark.serializer                        org.apache.spark.serializer.KryoSerializer

# WHAT:   Maximum size of Kryo serialization buffer
# WHY:    512MB handles large objects that need serialization
#         Default 64MB may be too small for complex nested structures
# HOW:    Buffer grows as needed up to this maximum
# IMPACT: Too low = "Buffer overflow" errors during serialization
#         Too high = Wastes memory if not needed
# PROD:   Increase if you see "Kryo buffer overflow" errors
#         512MB to 1GB is usually sufficient
spark.kryoserializer.buffer.max         512m


# ============================================================================
# SPARK UI CONFIGURATION
# ============================================================================
# The Spark UI provides real-time monitoring of:
#   - Job progress and DAG visualization
#   - Stage details and task metrics
#   - Storage (cached data) information
#   - Environment and executor status
#   - SQL query plans and metrics
# ============================================================================

# WHAT:   Enables the Spark web UI
# WHY:    Essential for monitoring, debugging, and learning Spark internals
# HOW:    Starts embedded Jetty web server
# IMPACT: Minimal overhead - always enable for learning
# PROD:   Usually enabled. Disable only in secure environments where
#         UI exposure is a concern
spark.ui.enabled                        true

# WHAT:   Port for the Spark application UI
# WHY:    4040 is Spark's default. If busy, Spark tries 4041, 4042, etc.
# HOW:    Access at http://localhost:4040 (or driver host)
# IMPACT: No performance impact - just network binding
# PROD:   Often behind reverse proxy. May use different port
spark.ui.port                           4040

# WHAT:   Number of completed jobs to retain in UI memory
# WHY:    100 jobs provides enough history for debugging without excess memory
# HOW:    Older job data is discarded when limit reached
# IMPACT: Higher = more history but more driver memory usage
#         Lower = less history, less memory
# PROD:   100-1000 depending on job frequency and driver memory
spark.ui.retainedJobs                   100

# WHAT:   Number of completed stages to retain in UI
# WHY:    100 stages provides good debugging window
# HOW:    Stage details (tasks, metrics) discarded when limit reached
# IMPACT: Each stage retains task-level metrics - can use significant memory
# PROD:   100-500 is typical
spark.ui.retainedStages                 100

# WHAT:   Number of completed tasks to retain in UI
# WHY:    1000 tasks provides detailed view without overwhelming memory
# HOW:    Task metrics (duration, shuffle read/write) are retained
# IMPACT: Tasks are numerous - this can use significant memory
#         With 1000 tasks at ~1KB each = ~1MB overhead
# PROD:   1000-10000 depending on available driver memory
spark.ui.retainedTasks                  1000


# ============================================================================
# HISTORY SERVER CONFIGURATION
# ============================================================================
# The History Server allows viewing completed application UIs after the
# application has finished. It reads event logs from a configured directory.
#
# Without History Server, UI data is lost when the application terminates.
# ============================================================================

# WHAT:   Class that provides history data to the History Server
# WHY:    FsHistoryProvider reads event logs from filesystem (local or HDFS)
# HOW:    Reads JSON event logs, reconstructs application state
# IMPACT: No runtime impact - only affects History Server
# PROD:   Same provider, but logs typically stored in HDFS/S3
spark.history.provider                  org.apache.spark.deploy.history.FsHistoryProvider

# WHAT:   Directory where History Server looks for event logs
# WHY:    /opt/spark/logs is our mounted logs directory
# HOW:    History Server scans this directory for completed app logs
# IMPACT: Must match spark.eventLog.dir for logs to be found
# PROD:   Typically HDFS path: hdfs:///spark/history or S3: s3a://bucket/logs
spark.history.fs.logDirectory           /opt/spark/logs

# WHAT:   How often History Server checks for new/updated logs
# WHY:    10 seconds provides near-real-time updates without excessive I/O
# HOW:    Background thread polls directory on this interval
# IMPACT: Lower = More responsive but more I/O
#         Higher = Less responsive but less I/O
# PROD:   10-30 seconds is typical
spark.history.fs.updateInterval         10s

# WHAT:   Port for History Server web UI
# WHY:    18080 is Spark's default History Server port
# HOW:    Access at http://localhost:18080 when History Server is running
# IMPACT: No performance impact
# PROD:   Same port, often behind load balancer
spark.history.ui.port                   18080


# ============================================================================
# EVENT LOGGING CONFIGURATION
# ============================================================================
# Event logging writes detailed execution information to files that can be:
#   - Viewed in History Server after job completion
#   - Analyzed for performance tuning
#   - Audited for compliance
#
# CRITICAL: Without event logging, all job history is lost on termination!
# ============================================================================

# WHAT:   Enables writing of Spark event logs
# WHY:    Essential for post-mortem analysis and History Server
# HOW:    Driver writes JSON events (job start, stage complete, etc.) to files
# IMPACT: Small I/O overhead (~1-5% depending on task count)
#         Logs can grow large for long-running apps
# PROD:   Always enable - logs are invaluable for debugging
spark.eventLog.enabled                  true

# WHAT:   Directory where event logs are written
# WHY:    /opt/spark/logs is our mounted logs directory
# HOW:    One JSON file per application: app-TIMESTAMP-ID.json
# IMPACT: Must be accessible by driver. In cluster mode, must be shared storage
# PROD:   HDFS/S3 for durability: hdfs:///spark/history or s3a://bucket/logs
spark.eventLog.dir                      /opt/spark/logs

# WHAT:   Enables rolling event logs to prevent single large files
# WHY:    Prevents multi-GB log files for long-running applications
# HOW:    Creates new log file periodically, rolls old ones
# IMPACT: Better for long-running apps and streaming jobs
#         Slightly more complex log management
# PROD:   Enable for streaming and long-running batch jobs
spark.eventLog.rolling.enabled          true

# WHAT:   Number of rolled log files to keep per application
# WHY:    10 files provides good history while limiting disk usage
# HOW:    Oldest files deleted when limit reached
# IMPACT: More files = more history but more disk usage
#         10 files * ~100MB each = ~1GB max per app
# PROD:   Depends on retention requirements. May keep more for compliance
spark.eventLog.rolling.maxFilesToRetain 10


# ============================================================================
# DATA STORAGE CONFIGURATION
# ============================================================================

# WHAT:   Default location for managed tables (tables without explicit LOCATION)
# WHY:    /opt/spark/data/warehouse is our mounted data directory
# HOW:    When you CREATE TABLE without LOCATION, data goes here
# IMPACT: Affects where Spark SQL stores managed table data
# PROD:   Typically HDFS/S3 path. Often points to Hive metastore warehouse
spark.sql.warehouse.dir                 /opt/spark/data/warehouse


# ============================================================================
# COMPRESSION CONFIGURATION
# ============================================================================
# Compression reduces storage size and network transfer time at the cost
# of CPU. For most workloads, compression is a net win.
#
# Common codecs:
#   - snappy: Fast compression/decompression, moderate ratio (RECOMMENDED)
#   - gzip/zlib: High ratio but slow (good for cold storage)
#   - lz4: Very fast, lower ratio (good for intermediate data)
#   - zstd: Best ratio with good speed (newer, excellent choice)
# ============================================================================

# WHAT:   Default compression codec for Parquet files
# WHY:    Snappy provides excellent speed/ratio balance for interactive use
#         ~2-3x compression with minimal CPU overhead
# HOW:    Applied when writing Parquet files without explicit codec
# IMPACT: Affects write speed, file size, and read speed
#         Snappy: Fast read/write, good compression
#         ZSTD: Better compression, slightly slower
# PROD:   Snappy for hot/warm data, ZSTD/GZIP for cold storage archives
spark.sql.parquet.compression.codec     snappy

# WHAT:   Default compression codec for ORC files
# WHY:    Snappy for consistency with Parquet settings
# HOW:    Applied when writing ORC files without explicit codec
# IMPACT: Same considerations as Parquet compression
# PROD:   ORC often uses ZLIB by default. ZSTD is excellent choice
spark.sql.orc.compression.codec         snappy


# ============================================================================
# FILESYSTEM CONFIGURATION
# ============================================================================

# WHAT:   Default filesystem scheme when paths don't specify one
# WHY:    file:/// for local filesystem - appropriate for Docker environment
# HOW:    Path "/data/test" becomes "file:///data/test"
# IMPACT: Determines default storage location
# PROD:   Typically hdfs:// or s3a:// for distributed storage
spark.hadoop.fs.defaultFS               file:///


# ============================================================================
# PYTHON / PYSPARK CONFIGURATION
# ============================================================================
# PySpark runs Python code alongside the JVM:
#   - Driver: Python main process + JVM via Py4J
#   - Executors: Python worker processes for UDFs and pandas operations
# ============================================================================

# WHAT:   Python executable for executor Python workers
# WHY:    python3 ensures Python 3.x is used (Python 2 is deprecated)
# HOW:    When PySpark UDFs run, this Python interprets them
# IMPACT: Must match between driver and executors
#         Mismatches cause serialization errors
# PROD:   Often points to virtualenv or conda environment
#         /opt/conda/bin/python or similar
spark.pyspark.python                    python3

# WHAT:   Python executable for the driver process
# WHY:    Should match pyspark.python for consistency
# HOW:    Your main script runs with this Python
# IMPACT: Mismatch with executor Python can cause subtle bugs
# PROD:   Same as spark.pyspark.python for consistency
spark.pyspark.driver.python             python3


# ============================================================================
# END OF CONFIGURATION
# ============================================================================
#
# ADDITIONAL CONFIGURATIONS TO CONSIDER FOR PRODUCTION:
#
# Dynamic Allocation (auto-scale executors):
#   spark.dynamicAllocation.enabled=true
#   spark.dynamicAllocation.minExecutors=1
#   spark.dynamicAllocation.maxExecutors=100
#   spark.shuffle.service.enabled=true
#
# Speculation (handle slow tasks):
#   spark.speculation=true
#   spark.speculation.quantile=0.9
#
# Memory Management:
#   spark.memory.fraction=0.6 (default)
#   spark.memory.storageFraction=0.5 (of memory.fraction)
#
# Network:
#   spark.network.timeout=120s
#   spark.rpc.askTimeout=120s
#
# For more configurations, see:
#   https://spark.apache.org/docs/latest/configuration.html
# ============================================================================
