services:
  spark-single:
    build:
      context: .
      dockerfile: Dockerfile.spark
      args:
        SPARK_VERSION: ${SPARK_VERSION}
    image: spark-lab-spark
    user: "0:0"
    container_name: spark-single
    hostname: spark-single
    ports:
      - "4040:4040"
      - "${SPARK_CONNECT_PORT}:${SPARK_CONNECT_PORT}"
    environment:
      - SPARK_MASTER_HOST=single
      - SPARK_CONNECT_PORT=${SPARK_CONNECT_PORT}
      - PYTHONPATH=/opt/spark
    command: >
      /bin/bash -c "
      /opt/spark/sbin/start-connect-server.sh
      && tail -f /dev/null
      "
    volumes:
      - ../examples:/opt/spark/apps
      - ../data:/opt/spark/data
      - ../config:/opt/spark/conf
      - ../utils:/opt/spark/utils
      - ../logs:/opt/spark/logs
      - ../tests:/opt/spark/tests

  jupyter:
    build:
      context: .
      dockerfile: Dockerfile.jupyter
    image: spark-lab-jupyter
    container_name: jupyter
    hostname: jupyter
    ports:
      - "${JUPYTER_PORT}:${JUPYTER_PORT}"
    environment:
      - JUPYTER_TOKEN=${JUPYTER_TOKEN}
      - SPARK_CONNECT_HOST=spark-single
      - SPARK_CONNECT_PORT=${SPARK_CONNECT_PORT}
    volumes:
      - ../notebooks:/home/jovyan/notebooks
      - ../examples:/home/jovyan/apps
      - ../data:/opt/spark/data
      - ../utils:/opt/spark/utils

  spark-history:
    image: apache/spark:${SPARK_VERSION}
    user: "0:0"
    container_name: spark-history
    hostname: spark-history
    ports:
      - "${SPARK_HISTORY_PORT}:${SPARK_HISTORY_PORT}"
    volumes:
      - ../logs:/opt/spark/logs
      - ../config:/opt/spark/conf
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.history.HistoryServer

networks:
  default:
    name: spark-network
