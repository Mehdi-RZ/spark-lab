services:
  spark-master:
    image: apache/spark:${SPARK_VERSION}
    user: "0:0"
    container_name: spark-master
    hostname: spark-master
    ports:
      - "${SPARK_MASTER_PORT}:${SPARK_MASTER_PORT}"
      - "${SPARK_MASTER_UI_PORT}:${SPARK_MASTER_UI_PORT}"
      - "${SPARK_CONNECT_PORT}:${SPARK_CONNECT_PORT}"
    environment:
      - SPARK_MASTER_HOST=${SPARK_MASTER_HOST}
      - SPARK_MASTER_PORT=${SPARK_MASTER_PORT}
      - SPARK_MASTER_UI_PORT=${SPARK_MASTER_UI_PORT}
      - SPARK_CONNECT_PORT=${SPARK_CONNECT_PORT}
      - SPARK_MODE=master
      - PYTHONPATH=/opt/spark
    volumes:
      - ../examples:/opt/spark/apps
      - ../data:/opt/spark/data
      - ../config:/opt/spark/conf
      - ../utils:/opt/spark/utils
      - ../logs:/opt/spark/logs
    command: >
      /bin/bash -c "
      /opt/spark/sbin/start-master.sh &&
      /opt/spark/sbin/start-connect-server.sh &&
      tail -f /dev/null
      "

  spark-worker-1:
    image: apache/spark:${SPARK_VERSION}
    user: "0:0"
    container_name: spark-worker-1
    hostname: spark-worker-1
    depends_on:
      - spark-master
    ports:
      - "${SPARK_WORKER_1_PORT}:${SPARK_WORKER_PORT}"
      - "${SPARK_WORKER_1_UI_PORT}:${SPARK_WORKER_UI_PORT}"
    environment:
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=${SPARK_MASTER_PORT}
      - SPARK_WORKER_CORES=${SPARK_WORKER_CORES}
      - SPARK_WORKER_MEMORY=${SPARK_WORKER_MEMORY}
      - SPARK_WORKER_PORT=${SPARK_WORKER_PORT}
      - SPARK_MODE=worker
      - PYTHONPATH=/opt/spark
    volumes:
      - ../examples:/opt/spark/apps
      - ../data:/opt/spark/data
      - ../utils:/opt/spark/utils
      - ../logs:/opt/spark/logs
    command: >
      /bin/bash -c "
      /opt/spark/sbin/start-worker.sh &&
      tail -f /dev/null
      "

  spark-worker-2:
    image: apache/spark:${SPARK_VERSION}
    user: "0:0"
    container_name: spark-worker-2
    hostname: spark-worker-2
    depends_on:
      - spark-master
    ports:
      - "${SPARK_WORKER_2_PORT}:${SPARK_WORKER_PORT}"
      - "${SPARK_WORKER_2_UI_PORT}:${SPARK_WORKER_UI_PORT}"
    environment:
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=${SPARK_MASTER_PORT}
      - SPARK_WORKER_CORES=${SPARK_WORKER_CORES}
      - SPARK_WORKER_MEMORY=${SPARK_WORKER_MEMORY}
      - SPARK_WORKER_PORT=${SPARK_WORKER_PORT}
      - SPARK_MODE=worker
      - PYTHONPATH=/opt/spark
    volumes:
      - ../examples:/opt/spark/apps
      - ../data:/opt/spark/data
      - ../utils:/opt/spark/utils
      - ../logs:/opt/spark/logs
    command: >
      /bin/bash -c "
      /opt/spark/sbin/start-worker.sh &&
      tail -f /dev/null
      "

  jupyter:
    image: jupyter/pyspark-notebook:latest
    container_name: jupyter
    hostname: jupyter
    ports:
      - "${JUPYTER_PORT}:${JUPYTER_PORT}"
    environment:
      - JUPYTER_TOKEN=${JUPYTER_TOKEN}
    volumes:
      - ../notebooks:/home/jovyan/notebooks
      - ../examples:/home/jovyan/apps
      - ../data:/home/jovyan/data

  spark-history:
    image: apache/spark:${SPARK_VERSION}
    user: "0:0"
    container_name: spark-history
    hostname: spark-history
    ports:
      - "18080:18080"
    environment:
      - SPARK_HISTORY_UI_PORT=18080
    volumes:
      - ../logs:/opt/spark/logs
      - ../config:/opt/spark/conf
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.history.HistoryServer

networks:
  default:
    name: spark-network
