services:
  spark-master:
    build:
      context: .
      dockerfile: Dockerfile.spark
      args:
        SPARK_VERSION: ${SPARK_VERSION}
    image: spark-lab-spark
    user: "0:0"
    container_name: spark-master
    hostname: spark-master
    ports:
      - "${SPARK_MASTER_PORT}:${SPARK_MASTER_PORT}"
      - "${SPARK_MASTER_WEBUI_PORT}:${SPARK_MASTER_WEBUI_PORT}"
      - "${SPARK_CONNECT_PORT}:${SPARK_CONNECT_PORT}"
    environment:
      - SPARK_MASTER_HOST=${SPARK_MASTER_HOST}
      - SPARK_MASTER_PORT=${SPARK_MASTER_PORT}
      - SPARK_MASTER_WEBUI_PORT=${SPARK_MASTER_WEBUI_PORT}
      - SPARK_CONNECT_PORT=${SPARK_CONNECT_PORT}
      - PYTHONPATH=/opt/spark
    command: >
      /bin/bash -c "
      /opt/spark/sbin/start-master.sh
      &&
      /opt/spark/sbin/start-connect-server.sh
      --master spark://spark-master:${SPARK_MASTER_PORT}
      &&
      tail -f /dev/null
      "
    volumes:
      - ../examples:/opt/spark/apps
      - ../data:/opt/spark/data
      - ../config:/opt/spark/conf
      - ../utils:/opt/spark/utils
      - ../logs:/opt/spark/logs

  spark-worker-1:
    image: spark-lab-spark
    user: "0:0"
    container_name: spark-worker-1
    hostname: spark-worker-1
    depends_on:
      - spark-master
    ports:
      - "${SPARK_WORKER_1_PORT}:${SPARK_WORKER_1_PORT}"
      - "${SPARK_WORKER_1_UI_PORT}:${SPARK_WORKER_1_UI_PORT}"
    environment:
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=${SPARK_MASTER_PORT}
      - SPARK_WORKER_CORES=${SPARK_WORKER_CORES}
      - SPARK_WORKER_MEMORY=${SPARK_WORKER_MEMORY}
      - SPARK_WORKER_PORT=${SPARK_WORKER_1_PORT}
      - SPARK_WORKER_WEBUI_PORT=${SPARK_WORKER_1_UI_PORT}
      - PYTHONPATH=/opt/spark
    volumes:
      - ../examples:/opt/spark/apps
      - ../data:/opt/spark/data
      - ../utils:/opt/spark/utils
      - ../logs:/opt/spark/logs
    command: >
      /bin/bash -c "
      /opt/spark/sbin/start-worker.sh spark://spark-master:${SPARK_MASTER_PORT} &&
      tail -f /dev/null
      "

  spark-worker-2:
    image: spark-lab-spark
    user: "0:0"
    container_name: spark-worker-2
    hostname: spark-worker-2
    depends_on:
      - spark-master
    ports:
      - "${SPARK_WORKER_2_PORT}:${SPARK_WORKER_2_PORT}"
      - "${SPARK_WORKER_2_UI_PORT}:${SPARK_WORKER_2_UI_PORT}"
    environment:
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=${SPARK_MASTER_PORT}
      - SPARK_WORKER_CORES=${SPARK_WORKER_CORES}
      - SPARK_WORKER_MEMORY=${SPARK_WORKER_MEMORY}
      - SPARK_WORKER_PORT=${SPARK_WORKER_2_PORT}
      - SPARK_WORKER_WEBUI_PORT=${SPARK_WORKER_2_UI_PORT}
      - PYTHONPATH=/opt/spark
    volumes:
      - ../examples:/opt/spark/apps
      - ../data:/opt/spark/data
      - ../utils:/opt/spark/utils
      - ../logs:/opt/spark/logs
    command: >
      /bin/bash -c "
      /opt/spark/sbin/start-worker.sh spark://spark-master:${SPARK_MASTER_PORT} &&
      tail -f /dev/null
      "

  jupyter:
    build:
      context: .
      dockerfile: Dockerfile.jupyter
    image: spark-lab-jupyter
    container_name: jupyter
    hostname: jupyter
    ports:
      - "${JUPYTER_PORT}:${JUPYTER_PORT}"
    environment:
      - JUPYTER_TOKEN=${JUPYTER_TOKEN}
      - SPARK_CONNECT_HOST=spark-master
      - SPARK_CONNECT_PORT=${SPARK_CONNECT_PORT}
    volumes:
      - ../notebooks:/home/jovyan/notebooks
      - ../examples:/home/jovyan/apps
      - ../data:/opt/spark/data
      - ../utils:/opt/spark/utils

  spark-history:
    image: apache/spark:${SPARK_VERSION}
    user: "0:0"
    container_name: spark-history
    hostname: spark-history
    ports:
      - "${SPARK_HISTORY_PORT}:${SPARK_HISTORY_PORT}"
    volumes:
      - ../logs:/opt/spark/logs
      - ../config:/opt/spark/conf
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.history.HistoryServer

networks:
  default:
    name: spark-network

